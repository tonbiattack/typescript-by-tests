name: 教材テーマの提案
description: TypeScriptまたはNode.jsの見落としやすい挙動を、短いSource/Testの対として提案します。
title: "lesson: "
body:
  - type: markdown
    attributes:
      value: |
        1つのAPI・型・実行時契約に焦点を絞り、期待値またはErrorを再現可能に記述してください。
  - type: dropdown
    id: category
    attributes:
      label: カテゴリ
      options:
        - Language
        - Collections
        - Numbers
        - Functional
        - Error Handling
        - Generics
        - Date / Time
        - Concurrency
    validations:
      required: true
  - type: input
    id: runtime-version
    attributes:
      label: 対象ランタイム・バージョン
      placeholder: "例: TypeScript 5 / Node.js 22"
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: 確認したい契約
      description: どの入力に対して、どの値・Error・状態を期待するかを1〜3文で記述してください。
      placeholder: "例: Object.freezeは入れ子のobjectを再帰的に凍結しない。"
    validations:
      required: true
  - type: textarea
    id: minimal-example
    attributes:
      label: 最小再現コード
      description: TypeScriptコードと、期待値またはErrorを記載してください。外部サービス・実時刻には依存させないでください。
      render: typescript
    validations:
      required: true
  - type: textarea
    id: learning-value
    attributes:
      label: なぜ見落としやすいか
      description: 型上の期待と実行時挙動、または似たAPIとの違いを説明してください。
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: 確認事項
      options:
        - label: 1つの仕様・API・型契約に焦点を絞っています。
          required: true
        - label: 正常系に加え、境界値または失敗時の挙動を説明しています。
          required: true
        - label: 外部資格情報、実ネットワーク、実時刻へ依存していません。
          required: true
