name: Verify TypeScript examples and build site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check the site and examples
        run: npm run typecheck
      - name: Run executable TypeScript examples
        run: npm run test:examples
      - name: Build Astro site for GitHub Pages
        run: GITHUB_ACTIONS=true npm run build
      - name: Verify GitHub Pages links
        run: npm run verify:links
